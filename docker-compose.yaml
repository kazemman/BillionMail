version: "3.8"

services:
  pgsql-billionmail:
    image: postgres:17.4-alpine
    hostname: pgsql
    volumes:
      - ./postgresql-data:/var/lib/postgresql/data
      - ./postgresql-socket:/var/run/postgresql
    environment:
      - TZ=${TZ}
      - POSTGRES_DB=${DBNAME}
      - POSTGRES_USER=${DBUSER}
      - POSTGRES_PASSWORD=${DBPASS}
    restart: always
    ports:
      - "${SQL_PORT:-25432}:5432"
    networks:
      billionmail-network:
        aliases:
          - pgsql

  redis-billionmail:
    image: redis:7.4.2-alpine
    hostname: redis
    entrypoint: ["/bin/sh","/redis-conf.sh"]
    volumes:
      - ./redis-data:/data
      - ./conf/redis/redis-conf.sh:/redis-conf.sh
    environment:
      - TZ=${TZ}
      - REDISPASS=${REDISPASS}
    restart: always
    networks:
      billionmail-network:
        aliases:
          - redis

  core-billionmail:
    image: billionmail/core:4.7.2
    hostname: core-manage
    depends_on:
      - pgsql-billionmail
    cap_add:
      - NET_BIND_SERVICE
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./ssl:/etc/ssl/mail
      - ./ssl-self-signed:/etc/ssl/ssl-self-signed
      - ./conf/core:/opt/billionmail/conf
      - ./logs:/opt/billionmail/logs
      - ./core-data:/opt/billionmail/core/data
      - ./vmail-data:/opt/billionmail/vmail-data
    environment:
      - TZ=${TZ}
      - FAIL2BAN_INIT=${FAIL2BAN_INIT:-y}
    ports:
      - "${HTTP_PORT:-8081}:80"
      - "${HTTPS_PORT:-8443}:443"
    restart: always
    networks:
      billionmail-network:
        aliases:
          - core

  webmail-billionmail:
    image: roundcube/roundcubemail:1.6.10-fpm-alpine
    hostname: roundcube
    depends_on:
      - pgsql-billionmail
      - core-billionmail
    volumes:
      - ./webmail-data:/var/www/html
      - ./conf/webmail:/var/roundcube/config
    environment:
      - TZ=${TZ}
      - ROUNDCUBEMAIL_DB_TYPE=pgsql
      - ROUNDCUBEMAIL_DB_HOST=pgsql
      - ROUNDCUBEMAIL_DB_NAME=${DBNAME}
      - ROUNDCUBEMAIL_DB_USER=${DBUSER}
      - ROUNDCUBEMAIL_DB_PASSWORD=${DBPASS}
      - ROUNDCUBEMAIL_DEFAULT_HOST=core
      - ROUNDCUBEMAIL_DEFAULT_PORT=8081
    ports:
      - "${WEBMAIL_PORT:-8082}:80"
    restart: always
    networks:
      billionmail-network:
        aliases:
          - webmail

networks:
  billionmail-network:
    driver: bridge
